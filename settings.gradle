pluginManagement {
    // Load loom_version from gradle.properties for use in plugins block
    def props = new Properties()
    file("gradle.properties").withInputStream { props.load(it) }
    def loomVersion = props.getProperty("loom_version", "1.8.9")

    plugins {
        id 'fabric-loom' version loomVersion
    }

    repositories {
        gradlePluginPortal()
        maven {
            url = "https://maven.fabricmc.net/"
        }
        mavenCentral()
    }
}

rootProject.name = "datalib-fabricmod"

include("core")
include("log")
include("main")
