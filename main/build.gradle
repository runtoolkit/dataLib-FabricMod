base {
    archivesName = "datalib-main"
}

tasks.jar {
    dependsOn(
        ":core:remapJar",
        ":log:remapJar"
    )

    from(zipTree(project(":core").tasks.named("remapJar").get().archiveFile)) {
        into("META-INF/jars")
        rename { "datalib-core.jar" }
    }

    from(zipTree(project(":log").tasks.named("remapJar").get().archiveFile)) {
        into("META-INF/jars")
        rename { "datalib-log.jar" }
    }
}
