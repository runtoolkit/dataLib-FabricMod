plugins {
    id 'java'
    id 'maven-publish'
}

base {
    archivesName = "datalib"
}

version = rootProject.mod_version
group = rootProject.maven_group

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven {
        name = "GitHubPackages-core"
        url = uri("https://maven.pkg.github.com/runtoolkit/datalib-core")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
        }
    }
    maven {
        name = "GitHubPackages-log"
        url = uri("https://maven.pkg.github.com/runtoolkit/datalib-log")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
        }
    }
    maven {
        name = "GitHubPackages-command"
        url = uri("https://maven.pkg.github.com/runtoolkit/datalib-command")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    // Sub-module jars fetched from GitHub Packages
    runtimeOnly "runtoolkit.datalib:datalib-core:${rootProject.mod_version}"
    runtimeOnly "runtoolkit.datalib:datalib-log:${rootProject.mod_version}"
    runtimeOnly "runtoolkit.datalib:datalib-command:${rootProject.mod_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_datalib" }
    }

    // Bundle sub-module jars into META-INF/jars
    configurations.runtimeOnly.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        from(artifact.file) {
            into("META-INF/jars")
        }
    }
}
