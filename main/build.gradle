base {
    archivesName = "datalib-main"
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
}

tasks.jar {
    dependsOn(
        ":core:remapJar",
        ":log:remapJar"
    )

    from(zipTree(project(":core").tasks.named("remapJar").get().archiveFile)) {
        into("META-INF/jars")
        rename { "datalib-core.jar" }
    }

    from(zipTree(project(":log").tasks.named("remapJar").get().archiveFile)) {
        into("META-INF/jars")
        rename { "datalib-log.jar" }
    }
}
