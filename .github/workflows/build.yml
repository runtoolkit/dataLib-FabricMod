name: Build DataLib Fabric Mod

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        run: ./gradlew clean build --stacktrace

      - name: List built jars
        run: find . -name "*.jar" -type f

      # Main Fat JAR (recommended - contains all modules)
      - name: Upload Main Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: datalib-main
          path: main/build/libs/*.jar

      # Sub-module JARs (optional, for advanced usage)
      - name: Upload Core Module
        uses: actions/upload-artifact@v4
        with:
          name: datalib-core
          path: core/build/libs/*.jar

      - name: Upload Command Module
        uses: actions/upload-artifact@v4
        with:
          name: datalib-command
          path: command/build/libs/*.jar

      - name: Upload Log Module
        uses: actions/upload-artifact@v4
        with:
          name: datalib-log
          path: log/build/libs/*.jar
