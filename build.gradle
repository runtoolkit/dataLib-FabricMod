plugins {
    id 'fabric-loom' apply false
    id 'maven-publish'
}

// Only core uses Loom now
project(":core") {
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    }

    loom {
        mods {
            "datalib" {
                sourceSet sourceSets.main
            }
        }
    }

    processResources {
        inputs.property "version", project.version
        filesMatching("fabric.mod.json") {
            expand "version": project.version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${project.name}" }
        }
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                from components.java
            }
        }
    }
}

// main: plain Java, no Loom
project(":main") {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
    }

    dependencies {
        compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    processResources {
        inputs.property "version", project.version
        filesMatching("fabric.mod.json") {
            expand "version": project.version
        }
    }

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${project.name}" }
        }
        dependsOn(":core:remapJar")
        from(zipTree(project(":core").tasks.named("remapJar").get().archiveFile)) {
            into("META-INF/jars")
            rename { "datalib-core.jar" }
        }
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                from components.java
            }
        }
    }
}
